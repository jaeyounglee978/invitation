<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>웨딩 앨범 — 이준호 &amp; 서다인</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400&family=IBM+Plex+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
:root{
  --celadon-deep:#6B8A7C;
  --hanji:#FAF8F3;
  --ink:#1C2622;
  --ink-soft:#5E6B64;
  --line:rgba(28,38,34,.14);
  --display:'Gowun Batang', serif;
  --body:'IBM Plex Sans KR', system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--hanji);color:var(--ink);font-family:var(--body);font-weight:300;
  -webkit-font-smoothing:antialiased;}

header{padding:70px 26px 44px;text-align:center;max-width:640px;margin:0 auto;}
header .label{font-size:.68rem;letter-spacing:.42em;text-indent:.42em;color:var(--celadon-deep);font-weight:500;}
header h1{font-family:var(--display);font-weight:400;font-size:1.9rem;letter-spacing:.14em;margin:22px 0 0;}
header p{margin:12px 0 0;font-size:.84rem;color:var(--ink-soft);letter-spacing:.06em;}

.grid{
  max-width:640px;margin:0 auto;padding:0 12px 80px;
  display:grid;grid-template-columns:repeat(2,1fr);gap:8px;
}
.grid button{
  padding:0;border:1px solid var(--line);background:#E4DFD4 center/cover no-repeat;
  aspect-ratio:3/4;cursor:pointer;display:block;width:100%;
  opacity:0;filter:blur(9px);transform:translateY(18px);
  transition:opacity .8s ease,filter .8s ease,transform .8s cubic-bezier(.2,.7,.2,1);
}
.grid button.in{opacity:1;filter:blur(0);transform:none;}
.grid button.wide{grid-column:1/-1;aspect-ratio:3/2;}
.grid button:focus-visible{outline:2px solid var(--celadon-deep);outline-offset:3px;}

.back{
  display:block;text-align:center;padding:0 26px 90px;
  font-size:.82rem;letter-spacing:.1em;color:var(--celadon-deep);text-decoration:none;
}

/* 확대 보기 */
.viewer{
  position:fixed;inset:0;background:rgba(20,26,23,.94);z-index:60;
  display:none;align-items:center;justify-content:center;
}
.viewer.open{display:flex;}

/* 저화질을 먼저 깔고, 고화질이 도착하면 그 위로 겹쳐 보여줍니다 */
.stage-img{position:relative;line-height:0;}
.stage-img img{max-width:92vw;max-height:82vh;max-height:82dvh;object-fit:contain;display:block;}
.stage-img .low{filter:blur(12px);transform:scale(1.02);}
.stage-img .high{
  position:absolute;inset:0;width:100%;height:100%;max-width:none;max-height:none;
  opacity:0;transition:opacity .45s ease;
}
.stage-img .high.ready{opacity:1;}
.stage-img .spinner{
  position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;
  border:1px solid rgba(255,255,255,.28);border-top-color:rgba(255,255,255,.8);
  border-radius:50%;opacity:0;transition:opacity .2s ease;pointer-events:none;
  animation:spin .9s linear infinite;
}
.stage-img.loading .spinner{opacity:1;}
@keyframes spin{to{transform:rotate(360deg);}}
.viewer .nav{
  position:absolute;top:0;bottom:0;width:34%;border:0;background:transparent;
  cursor:pointer;color:transparent;font-size:0;
}
.viewer .prev{left:0;} .viewer .next{right:0;}
@media (max-width:600px){
  .viewer .nav{width:22%;}
  .viewer .close{top:max(14px,env(safe-area-inset-top));right:14px;}
  .viewer .count{bottom:max(20px,env(safe-area-inset-bottom));}
}
.viewer .close{
  position:absolute;top:18px;right:18px;width:44px;height:44px;
  border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;
  font-size:.75rem;cursor:pointer;border-radius:50%;
}
.viewer .count{
  position:absolute;bottom:26px;left:0;right:0;text-align:center;
  color:rgba(255,255,255,.7);font-size:.76rem;letter-spacing:.16em;
}
@media (prefers-reduced-motion:reduce){
  .grid button{transition-duration:.01ms;}
  .stage-img .high{transition-duration:.01ms;}
  .stage-img .spinner{animation:none;}
}
</style>
</head>
<body>

<header>
  <p class="label">WEDDING ALBUM</p>
  <h1>이준호 · 서다인</h1>
  <p>2026년 겨울, 제주에서</p>
</header>

<div class="grid" id="grid"></div>

<a class="back" href="../">← 청첩장으로 돌아가기</a>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="사진 크게 보기">
  <button class="nav prev" id="prev">이전</button>
  <div class="stage-img" id="stage-img">
    <img class="low" id="viewer-low" alt="" aria-hidden="true" />
    <img class="high" id="viewer-high" alt="" />
    <span class="spinner" aria-hidden="true"></span>
  </div>
  <button class="nav next" id="next">다음</button>
  <button class="close" id="close" aria-label="닫기">닫기</button>
  <p class="count" id="count"></p>
</div>

<script>
/* ====== 여기만 바꾸시면 됩니다 ======
   같은 파일명을 두 디렉터리에 넣어주세요.
     ../assets/album/low/01.jpg   ← 목록용 저화질
     ../assets/album/high/01.jpg  ← 클릭하면 보이는 고화질
   wide:true 는 가로로 넓게 배치됩니다. */
const ALBUM = {
  count: 12,
  lowDir:  '../assets/album/low',
  highDir: '../assets/album/high',
  ext: 'jpg',
  wide: i => i % 5 === 2
};
/* ================================== */

const PHOTOS = Array.from({length:ALBUM.count}, (_,i)=>{
  const file = `${String(i+1).padStart(2,'0')}.${ALBUM.ext}`;
  return { low:`${ALBUM.lowDir}/${file}`, high:`${ALBUM.highDir}/${file}`, wide:ALBUM.wide(i) };
});

const grid = document.getElementById('grid');
grid.innerHTML = PHOTOS.map((p,i)=>
  `<button class="${p.wide?'wide':''}" data-i="${i}"
     style="background-image:url('${p.low}')" aria-label="사진 ${i+1} 크게 보기"></button>`
).join('');

/* 블러 페이드인 */
const io = new IntersectionObserver((es)=>{
  es.forEach((e,n)=>{
    if(e.isIntersecting){
      e.target.style.transitionDelay = (n * 0.06) + 's';
      e.target.classList.add('in');
      io.unobserve(e.target);
    }
  });
},{threshold:0.12});
grid.querySelectorAll('button').forEach(b=>io.observe(b));

/* 확대 보기 */
const viewer = document.getElementById('viewer');
const stageImg = document.getElementById('stage-img');
const vlow = document.getElementById('viewer-low');
const vhigh = document.getElementById('viewer-high');
const count = document.getElementById('count');
let idx = 0;
let loadToken = 0;   /* 빠르게 넘길 때 늦게 도착한 이미지가 덮어쓰지 않도록 */

/* 이미 받아둔 고화질은 다시 기다리지 않습니다 */
const highCache = new Set();

/* 셀룰러·데이터 절약 모드에서는 미리 받지 않습니다 */
function mayPrefetch(){
  const c = navigator.connection;
  if(!c) return true;
  if(c.saveData) return false;
  return !['slow-2g','2g','3g'].includes(c.effectiveType);
}

function preloadHigh(i){
  if(!mayPrefetch()) return;
  const p = PHOTOS[(i + PHOTOS.length) % PHOTOS.length];
  if(highCache.has(p.high)) return;
  const img = new Image();
  img.onload = ()=>highCache.add(p.high);
  img.src = p.high;
}

function open(i){
  idx = (i + PHOTOS.length) % PHOTOS.length;
  const p = PHOTOS[idx];
  const token = ++loadToken;

  /* 1. 목록에 쓰던 저화질을 먼저 띄웁니다 (대개 캐시에 있어 즉시 보입니다) */
  vlow.src = p.low;
  vlow.alt = '';
  vhigh.classList.remove('ready');
  vhigh.removeAttribute('src');
  vhigh.alt = `웨딩 사진 ${idx+1}`;
  count.textContent = `${idx+1} / ${PHOTOS.length}`;
  viewer.classList.add('open');
  document.body.style.overflow = 'hidden';

  /* 2. 고화질을 받아 도착하면 위로 겹칩니다 */
  if(!highCache.has(p.high)) stageImg.classList.add('loading');
  const hi = new Image();
  hi.onload = ()=>{
    highCache.add(p.high);
    if(token !== loadToken) return;
    vhigh.src = p.high;
    vhigh.classList.add('ready');
    stageImg.classList.remove('loading');
    preloadHigh(idx + 1);
    preloadHigh(idx - 1);
  };
  hi.onerror = ()=>{
    if(token !== loadToken) return;
    stageImg.classList.remove('loading');   /* 고화질이 없으면 저화질 그대로 둡니다 */
  };
  hi.src = p.high;
}
function close(){
  viewer.classList.remove('open');
  document.body.style.overflow = '';
  loadToken++;                       /* 받는 중이던 고화질은 버립니다 */
  if(location.hash) history.replaceState(null, '', location.pathname);
}
grid.addEventListener('click', e=>{
  const b = e.target.closest('button[data-i]');
  if(b) open(Number(b.dataset.i));
});
document.getElementById('prev').addEventListener('click', ()=>open(idx-1));
document.getElementById('next').addEventListener('click', ()=>open(idx+1));
document.getElementById('close').addEventListener('click', close);
viewer.addEventListener('click', e=>{ if(e.target === viewer) close(); });
document.addEventListener('keydown', e=>{
  if(!viewer.classList.contains('open')) return;
  if(e.key === 'Escape') close();
  if(e.key === 'ArrowLeft') open(idx-1);
  if(e.key === 'ArrowRight') open(idx+1);
});
/* 청첩장 미리보기에서 #p3 처럼 들어오면 그 사진을 바로 엽니다 */
const jump = /^#p(\d+)$/.exec(location.hash);
if(jump){
  const n = Number(jump[1]);
  if(n >= 1 && n <= PHOTOS.length) open(n - 1);
}

/* 좌우 스와이프 */
let x0 = null, y0 = null;
viewer.addEventListener('touchstart', e=>{
  x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
}, {passive:true});
viewer.addEventListener('touchend', e=>{
  if(x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0;
  const dy = e.changedTouches[0].clientY - y0;
  if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) open(idx + (dx < 0 ? 1 : -1));
  x0 = y0 = null;
}, {passive:true});
</script>
</body>
</html>
