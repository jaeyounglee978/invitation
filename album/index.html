<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>웨딩 앨범 — 이준호 &amp; 서다인</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400&family=IBM+Plex+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
:root{
  --celadon-deep:#6B8A7C;
  --hanji:#FAF8F3;
  --ink:#1C2622;
  --ink-soft:#5E6B64;
  --line:rgba(28,38,34,.14);
  --display:'Gowun Batang', serif;
  --body:'IBM Plex Sans KR', system-ui, -apple-system, sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--hanji);color:var(--ink);font-family:var(--body);font-weight:300;
  -webkit-font-smoothing:antialiased;}

header{padding:70px 26px 44px;text-align:center;max-width:640px;margin:0 auto;}
header .label{font-size:.68rem;letter-spacing:.42em;text-indent:.42em;color:var(--celadon-deep);font-weight:500;}
header h1{font-family:var(--display);font-weight:400;font-size:1.9rem;letter-spacing:.14em;margin:22px 0 0;}
header p{margin:12px 0 0;font-size:.84rem;color:var(--ink-soft);letter-spacing:.06em;}

.grid{
  max-width:640px;margin:0 auto;padding:0 12px 80px;
  display:grid;grid-template-columns:repeat(2,1fr);gap:8px;
}
.grid button{
  padding:0;border:1px solid var(--line);background:#E4DFD4 center/cover no-repeat;
  aspect-ratio:3/4;cursor:pointer;display:block;width:100%;
  opacity:0;filter:blur(9px);transform:translateY(18px);
  transition:opacity .8s ease,filter .8s ease,transform .8s cubic-bezier(.2,.7,.2,1);
}
.grid button.in{opacity:1;filter:blur(0);transform:none;}
.grid button.wide{grid-column:1/-1;aspect-ratio:3/2;}
.grid button:focus-visible{outline:2px solid var(--celadon-deep);outline-offset:3px;}

.back{
  display:block;text-align:center;padding:0 26px 90px;
  font-size:.82rem;letter-spacing:.1em;color:var(--celadon-deep);text-decoration:none;
}

/* 확대 보기 */
.viewer{
  position:fixed;inset:0;background:rgba(20,26,23,.94);z-index:60;
  display:none;align-items:center;justify-content:center;
}
.viewer.open{display:flex;}
.viewer img{max-width:92vw;max-height:82vh;object-fit:contain;}
.viewer .nav{
  position:absolute;top:0;bottom:0;width:34%;border:0;background:transparent;
  cursor:pointer;color:transparent;font-size:0;
}
.viewer .prev{left:0;} .viewer .next{right:0;}
.viewer .close{
  position:absolute;top:18px;right:18px;width:44px;height:44px;
  border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;
  font-size:.75rem;cursor:pointer;border-radius:50%;
}
.viewer .count{
  position:absolute;bottom:26px;left:0;right:0;text-align:center;
  color:rgba(255,255,255,.7);font-size:.76rem;letter-spacing:.16em;
}
@media (prefers-reduced-motion:reduce){ .grid button{transition-duration:.01ms;} }
</style>
</head>
<body>

<header>
  <p class="label">WEDDING ALBUM</p>
  <h1>이준호 · 서다인</h1>
  <p>2026년 겨울, 제주에서</p>
</header>

<div class="grid" id="grid"></div>

<a class="back" href="../">← 청첩장으로 돌아가기</a>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="사진 크게 보기">
  <button class="nav prev" id="prev">이전</button>
  <img id="viewer-img" alt="" />
  <button class="nav next" id="next">다음</button>
  <button class="close" id="close" aria-label="닫기">닫기</button>
  <p class="count" id="count"></p>
</div>

<script>
/* 사진 파일명만 채우면 됩니다. wide:true 는 가로로 넓게 배치 */
const PHOTOS = Array.from({length:12}, (_,i)=>({
  src: `../assets/album/${String(i+1).padStart(2,'0')}.jpg`,
  wide: i % 5 === 2
}));

const grid = document.getElementById('grid');
grid.innerHTML = PHOTOS.map((p,i)=>
  `<button class="${p.wide?'wide':''}" data-i="${i}"
     style="background-image:url('${p.src}')" aria-label="사진 ${i+1} 크게 보기"></button>`
).join('');

/* 블러 페이드인 */
const io = new IntersectionObserver((es)=>{
  es.forEach((e,n)=>{
    if(e.isIntersecting){
      e.target.style.transitionDelay = (n * 0.06) + 's';
      e.target.classList.add('in');
      io.unobserve(e.target);
    }
  });
},{threshold:0.12});
grid.querySelectorAll('button').forEach(b=>io.observe(b));

/* 확대 보기 */
const viewer = document.getElementById('viewer');
const vimg = document.getElementById('viewer-img');
const count = document.getElementById('count');
let idx = 0;

function open(i){
  idx = (i + PHOTOS.length) % PHOTOS.length;
  vimg.src = PHOTOS[idx].src;
  vimg.alt = `웨딩 사진 ${idx+1}`;
  count.textContent = `${idx+1} / ${PHOTOS.length}`;
  viewer.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function close(){
  viewer.classList.remove('open');
  document.body.style.overflow = '';
}
grid.addEventListener('click', e=>{
  const b = e.target.closest('button[data-i]');
  if(b) open(Number(b.dataset.i));
});
document.getElementById('prev').addEventListener('click', ()=>open(idx-1));
document.getElementById('next').addEventListener('click', ()=>open(idx+1));
document.getElementById('close').addEventListener('click', close);
document.addEventListener('keydown', e=>{
  if(!viewer.classList.contains('open')) return;
  if(e.key === 'Escape') close();
  if(e.key === 'ArrowLeft') open(idx-1);
  if(e.key === 'ArrowRight') open(idx+1);
});
/* 좌우 스와이프 */
let x0 = null;
viewer.addEventListener('touchstart', e=>{ x0 = e.touches[0].clientX; }, {passive:true});
viewer.addEventListener('touchend', e=>{
  if(x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0;
  if(Math.abs(dx) > 50) open(idx + (dx < 0 ? 1 : -1));
  x0 = null;
}, {passive:true});
</script>
</body>
</html>
